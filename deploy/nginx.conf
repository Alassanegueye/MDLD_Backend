# ============================================================
# Nginx — reverse proxy de l'API MDLD
# À placer dans /etc/nginx/sites-available/ puis lier dans sites-enabled.
# Les certificats sont supposés émis par certbot.
# ============================================================

# Redirection HTTP -> HTTPS. Le bloc ACME reste en clair : sans lui, le
# renouvellement automatique du certificat échoue.
server {
    listen 80;
    listen [::]:80;
    server_name api.mosqueedeladivinite.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mosqueedeladivinite.org;

    ssl_certificate     /etc/letsencrypt/live/api.mosqueedeladivinite.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mosqueedeladivinite.org/privkey.pem;

    # TLS 1.2 et 1.3 uniquement : les versions antérieures sont cassées.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- En-têtes de sécurité ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Doit rester cohérent avec express.json({ limit: '512kb' }) et la
    # taille max des téléversements (3 Mo) : une limite plus basse ici
    # renverrait un 413 Nginx avant que l'API puisse répondre proprement.
    client_max_body_size 4m;

    # Journaux séparés : indispensable pour diagnostiquer sans fouiller
    # les logs de tous les sites de la machine.
    access_log /var/log/nginx/mdld-api.access.log;
    error_log  /var/log/nginx/mdld-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sans ces deux en-têtes, l'API voit l'IP du proxy et le
        # rate-limiting bloque tous les visiteurs d'un coup.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # La sonde de santé ne doit pas polluer les journaux d'accès.
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }
}
